@keyframes rise{0%{transform:translateY(100%)}55%{transform:translateY(0)}75%{transform:translateY(0)}100%{transform:translateY(-100%)}}
.wave{animation:w 1.2s ease-in-out infinite;transform-origin:50% 85%}
.fill{animation:rise 1.8s ease-in-out infinite}
.lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777;text-align:center;margin-top:16px;font-weight:600}
.glow{position:absolute;width:112px;height:112px;border-radius:9999px;background:linear-gradient(to top right,rgba(191,219,254,.6),rgba(251,207,232,.6));filter:blur(24px)}
